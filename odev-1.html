odev-1
iki metin kutusu bir açılır kutu
metin kutusuna sayılar girilecek
açılır kutudan dört işlemden biri seçilecek
hesapla butonu olacak
tıklanınca seçilen işlemi yapıp sonucu gösterecek.

<!DOCTYPE html>
<html>
<body>

<h3>İşlem Seçin:</h3>
<select id="operation">
  <option value="toplama">Toplama</option>
  <option value="cikarma">Çıkarma</option>
  <option value="carpma">Çarpma</option>
  <option value="bolme">Bölme</option>
</select>

<h3>Birinci Sayı:</h3>
<input type="number" id="num1" placeholder="Bir sayı girin">

<h3>İkinci Sayı:</h3>
<input type="number" id="num2" placeholder="Bir sayı girin">

<br><br>
<button onclick="hesapla()">Hesapla</button>

<h3>Sonuç:</h3>
<input type="text" id="result" readonly placeholder="Sonuç burada görünecek">

<script>
  function hesapla() {
    const operation = document.getElementById('operation').value;
    const num1 = parseFloat(document.getElementById('num1').value);
    const num2 = parseFloat(document.getElementById('num2').value);
    let sonuc;

    if (isNaN(num1) || isNaN(num2)) {
      sonuc = "Lütfen geçerli sayılar girin!";
    } else {
      switch(operation) {
        case 'toplama':
          sonuc = num1 + num2;
          break;
        case 'cikarma':
          sonuc = num1 - num2;
          break;
        case 'carpma':
          sonuc = num1 * num2;
          break;
        case 'bolme':
          if (num2 === 0) {
            sonuc = "Sıfıra bölünemez!";
          } else {
            sonuc = num1 / num2;
          }
          break;
        default:
          sonuc = "Geçersiz işlem!";
      }
    }

    document.getElementById('result').value = sonuc;
  }
</script>

</body>
</html>
